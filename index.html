<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container py-4" style="max-width: 820px;">
  <h1 class="h3 mb-4">نظام إدارة النتائج</h1>

  <div class="card p-3 mb-3">
    <div class="row g-3">
      <div class="col-12">
        <label for="studentName" class="form-label">اسم الطالب</label>
        <input type="text" id="studentName" class="form-control">
      </div>
      <div class="col-md-4">
        <label for="grade1" class="form-label">درجة المادة الأولى</label>
        <input type="number" id="grade1" class="form-control">
      </div>
      <div class="col-md-4">
        <label for="grade2" class="form-label">درجة المادة الثانية</label>
        <input type="number" id="grade2" class="form-control">
      </div>
      <div class="col-md-4">
        <label for="grade3" class="form-label">درجة المادة الثالثة</label>
        <input type="number" id="grade3" class="form-control">
      </div>
      <div class="col-12">
        <label for="attendance" class="form-label">نسبة الحضور (%)</label>
        <input type="number" id="attendance" class="form-control">
      </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <button id="addBtn" class="btn btn-primary">إضافة طالب</button>
      <button id="mercyBtn" class="btn btn-warning">تفعيل لجنة الرأفة</button>
    </div>
  </div>

  <div id="errorBox" class="error-box" role="alert"></div>

  <div class="card p-3 mb-3">
    <h2 class="h5">الطلاب المضافون</h2>
    <div id="listBox">لا يوجد طلاب بعد.</div>
  </div>

  <div class="card p-3">
    <h2 class="h5">التقرير النهائي للجنة الرأفة</h2>
    <div id="reportBox">اضغط "تفعيل لجنة الرأفة" لعرض التقرير.</div>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
